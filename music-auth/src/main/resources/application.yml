spring:
  application:
    name: music
  config:
    import:
      - classpath:application-common.yml
      - classpath:application-editor.yml

  #── 数据源 ──
  datasource:
    url: jdbc:h2:tcp://localhost:9092/./data/musicdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  #── SQL 初始化 ──
  sql:
    init:
      mode: always
      platform: h2
      schema-locations:
        - classpath*:schema-common-h2.sql
        - classpath*:schema-editor-h2.sql
        - classpath:schema-auth-h2.sql
        - classpath*:schema-playback-h2.sql

  #── H2 Console ──
  h2:
    console:
      enabled: true
      path: /h2-console

#── 服务器 ──
server:
  port: 8089

#── JWT 认证 ──
music:
  auth:
    jwt:
      secret: ${JWT_SECRET:change-me}
      access-token-expiration-seconds: 1800
      refresh-token-expiration-seconds: 604800
