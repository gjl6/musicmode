# 测试配置：嵌入式 H2（无需 TCP Server）
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

spring.sql.init.mode=always
spring.sql.init.platform=h2

# MyBatis
mybatis.type-aliases-package=com.gjl.music.model
mybatis.configuration.map-underscore-to-camel-case=true

# 音乐文件根目录（测试从 music-auth/ 运行，../ 回到项目根）
music.root-dir=../music
music.covers-dir=../covers

# 管道配置
pipeline.recovery.enabled=false

# 指纹配置
music.fingerprint.skip-if-exists=true
music.fingerprint.timeout-seconds=120

# 元数据增强（测试中不需要实际调用）
music.enrich.default-provider=
